[package]
name = "life-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.6.0", features = ["password-hash", "getrandom"] }
axum = "=0.8.9"
# Le jeton de Garmin est un JWT : sa date d'expiration se lit dans sa partie centrale.
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
fitparser = "=0.12.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
log = "=0.4.35"
# Le collecteur. rustls sur ring : pur Rust et C sans CMake, compilable en croisé depuis un Mac.
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rpassword = "=7.5.4"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
# arbitrary_precision : les nombres de la charge utile restent exacts jusqu'au jsonb.
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "tracing-log"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.29.0", features = ["serde", "v7"] }
# La trace d'une séance : le fichier d'origine de Garmin, un ZIP qui contient un .FIT. Pur Rust.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
jsonschema = { version = "=0.60.2", default-features = false }
