# Production sur le NAS (projet Container Manager). Marche à suivre : docs/deploiement.md.
# Spécification Compose sans clé `version`, limitée à ce que Compose 2.2 connaît.
# Chaque service ne lit que son propre fichier de secrets.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    env_file: ./secrets/db.env
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      # -h : pendant l'initialisation, le serveur temporaire n'écoute que sur son socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tracker"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  migrate:
    image: ${TRACKER_IMAGE_PREFIX:?}/backend:${TRACKER_TAG:?}
    command: ["migrate"]
    restart: "no"
    env_file: ./secrets/migrate.env
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backend:
    image: ${TRACKER_IMAGE_PREFIX:?}/backend:${TRACKER_TAG:?}
    command: ["serve"]
    restart: unless-stopped
    env_file: ./secrets/backend.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DEV_INSECURE_COOKIE: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data, front, collect, read]
    healthcheck:
      # Le 503 d'une base en panne rend le conteneur « unhealthy » sans le redémarrer :
      # `restart` ne réagit qu'à la fin du processus, et le backend attend le retour de la base.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: ${TRACKER_IMAGE_PREFIX:?}/web:${TRACKER_TAG:?}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [front, edge]
    ports:
      - "${TRACKER_BIND_ADDR:-127.0.0.1}:${TRACKER_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/manifest.webmanifest"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Interroge Last.fm, Garmin, YouTube, Steam et GitHub, chacun si sa clé est dans le fichier de
  # secrets, et écrit par l'API d'ingestion. Seul à sortir vers Internet : ni la base, ni le web. YouTube
  # joint oauth2.googleapis.com, dataportability.googleapis.com, storage.googleapis.com et
  # www.googleapis.com ; Steam, api.steampowered.com ; GitHub, api.github.com.
  collector:
    image: ${TRACKER_IMAGE_PREFIX:?}/backend:${TRACKER_TAG:?}
    command: ["collect"]
    restart: unless-stopped
    env_file: ./secrets/collector.env
    environment:
      INGEST_URL: http://backend:8080
    depends_on:
      - backend
    networks: [collect, egress]
    volumes:
      - collector-state:/var/lib/life-tracker
    healthcheck:
      # L'état de chaque connecteur configuré est réécrit à chaque passage réussi : Last.fm et YouTube
      # toutes les 5 min, Garmin, Steam et GitHub tous les quarts d'heure (GitHub aussi après chaque page
      # de son premier passage). « unhealthy » sans redémarrage : le collecteur réessaie déjà seul, et la
      # page d'état signale le silence de la source (une clé Garmin, Steam ou GitHub refusée, un accord
      # YouTube à donner aussi).
      test: ["CMD-SHELL", "fresh() { test -n \"$$(find /var/lib/life-tracker/$$1 -mmin -360)\"; }; { test -z \"$$LASTFM_API_KEY\" || fresh state.json; } && { test -z \"$$GARMIN_API_KEY\" || fresh garmin-state.json; } && { test -z \"$$YOUTUBE_CLIENT_ID\" || fresh youtube-state.json; } && { test -z \"$$STEAM_API_KEY\" || fresh steam-state.json; } && { test -z \"$$GITHUB_API_TOKEN\" || fresh github-state.json; }"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 15m
    # L'export YouTube passe par le disque (le volume d'état) et se lit en flux ; la marge couvre un
    # export lu pendant qu'une trace Garmin (32 Mo au plus) se télécharge.
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Le serveur MCP, seul exposé sur Internet (Tailscale Funnel, port 8443) : OAuth, lecture seule, par
  # l'API de lecture avec son jeton de service. Ni la base, ni sortie vers Internet.
  mcp:
    image: ${TRACKER_IMAGE_PREFIX:?}/mcp:${TRACKER_TAG:?}
    restart: unless-stopped
    env_file: ./secrets/mcp.env
    environment:
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?}
      MCP_BACKEND_URL: http://backend:8080
      MCP_LISTEN: 0.0.0.0:8080
      MCP_STATE_DIR: /var/lib/life-tracker-mcp
    depends_on:
      - backend
    networks: [read, mcp-edge]
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-18443}:8080"
    volumes:
      - mcp-state:/var/lib/life-tracker-mcp
    healthcheck:
      # Les métadonnées OAuth, servies sans jeton, avec le nom public qu'exige le contrôle de l'en-tête
      # Host. Le wget de busybox plutôt qu'un second Node, qui doublerait la mémoire.
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Host: $${MCP_PUBLIC_URL#https://}\" http://127.0.0.1:8080/.well-known/oauth-authorization-server"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # À la main : docker compose run --rm admin <commande>
  admin:
    profiles: [admin]
    image: ${TRACKER_IMAGE_PREFIX:?}/backend:${TRACKER_TAG:?}
    entrypoint: ["life-tracker", "admin"]
    command: ["--help"]
    restart: "no"
    env_file: ./secrets/admin.env
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # À la main, une fois : docs/deploiement.md. L'archive en lecture seule, le token sur l'entrée standard.
  # Sur `collect` seulement : ni la base, ni Internet.
  apple-import:
    profiles: [import]
    image: ${TRACKER_IMAGE_PREFIX:?}/backend:${TRACKER_TAG:?}
    entrypoint: ["life-tracker", "import-apple"]
    restart: "no"
    environment:
      INGEST_URL: http://backend:8080
      APPLE_ARCHIVE_DIR: /archive
    depends_on:
      - backend
    networks: [collect]
    volumes:
      - ./imports/apple:/archive:ro
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  # La base et ceux qui ont un rôle : ni sortie, ni web.
  data:
    internal: true
    driver_opts:
      # Aucune adresse sur le pont côté hôte : un compte du NAS ne joint pas la base par son IP.
      com.docker.network.bridge.inhibit_ipv4: "true"
  # Le web et le backend, sans accès direct du web à la base.
  front:
    internal: true
  # Le collecteur et le backend : le token ne passe que par ici.
  collect:
    internal: true
  # La seule sortie vers Internet, au collecteur seul. Docker ne filtre pas par destination.
  egress:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  # Le seul réseau qui porte un port publié.
  edge:
  # Le MCP et le backend, sans autre accès : le jeton de service ne passe que par ici.
  read:
    internal: true
  # Le port publié du MCP. Sans NAT sortant : le port reste joignable depuis l'hôte, mais le conteneur
  # ne sort pas vers Internet (un réseau interne ne peut pas publier de port).
  mcp-edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"

volumes:
  db-data:
    # Nom fixe : les données ne dépendent pas du nom du projet, et jamais du volume de développement.
    name: life-tracker-prod-db-data
  # Le curseur du collecteur. Le perdre ne coûte qu'un rattrapage, sans doublon.
  collector-state:
    name: life-tracker-prod-collector-state
  # Les jetons OAuth du MCP, hachés. Le perdre ne coûte qu'une nouvelle connexion depuis Claude.
  mcp-state:
    name: life-tracker-prod-mcp-state
