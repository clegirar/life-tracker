# Même origine : l'app statique et, derrière, l'API. Le HTTPS est terminé en amont par `tailscale serve`.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Le backend journalise déjà chaque requête, sans donnée personnelle.
    access_log off;

    # DNS de Docker résolu à chaque requête : le backend change d'adresse quand il est recréé.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # L'API décide du 413 (1 Mo) et répond en JSON. Au-delà de ce plafond, nginx refuse seul, en
    # donnant la même réponse : seul le dernier contact de la source n'est alors pas mis à jour.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    location /v1/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /health {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location @too_large {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":"batch_too_large"}';
    }

    location @backend_down {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"unavailable"}';
    }

    # Noms de fichiers hachés par Vite. Un fichier absent reste un 404 : renvoyer index.html
    # à sa place donnerait du HTML gardé un an sous le nom d'un script.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /icons/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Tout le reste : l'app (index.html), qui n'est jamais gardée.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
