# Cookie, Set-Cookie, Authorization et X-CSRF-Protection passent tels quels : nginx ne les filtre pas.
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_hide_header Cache-Control;
gzip off;
include /etc/nginx/snippets/security-headers.conf;
add_header Cache-Control "no-store" always;
error_page 413 = @too_large;
# Seulement les erreurs de nginx : le 503 de /health vient du backend et passe tel quel.
error_page 502 504 = @backend_down;
