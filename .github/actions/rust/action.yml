# Rust sur un runner du NAS (deploy/runner/compose.yaml) : rustup et cargo vivent dans le cache
# persistant (RUSTUP_HOME, CARGO_HOME), installés au premier job seulement, puis la toolchain de
# backend/rust-toolchain.toml. La compilation reste dans CARGO_TARGET_DIR, propre à chaque runner, d'un
# job à l'autre : pas de cache GitHub à restaurer.
name: Rust
description: rustup dans le cache du runner, puis la toolchain de backend/rust-toolchain.toml
runs:
  using: composite
  steps:
    - name: rustup, au premier passage
      shell: bash
      run: |
        : "${CARGO_HOME:?CARGO_HOME attendu (runner du NAS)}" "${RUSTUP_HOME:?RUSTUP_HOME attendu}"
        if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
        fi
        echo "$CARGO_HOME/bin" >>"$GITHUB_PATH"
    - name: Toolchain de backend/rust-toolchain.toml
      shell: bash
      working-directory: backend
      run: rustup toolchain install
