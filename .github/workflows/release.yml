# Déploiement continu. Quand la CI d'un push sur main est verte, deploy/next-version.sh regarde ce qui
# a changé depuis le dernier tag : si le contenu d'une image a bougé (backend/, web/, mcp/, hors tests
# et Markdown), il calcule vX.Y.Z d'après les types de commits, et le job crée le tag et la GitHub
# Release avec ses notes. Puis images linux/amd64 étiquetées vX.Y.Z sur ghcr.io, et déploiement sur le
# NAS par SSH sur 127.0.0.1 : tous les jobs tournent sur les runners du NAS (deploy/runner/compose.yaml). Tout se construit depuis le commit testé par la CI (head_sha).
# Retour arrière : Run workflow avec un tag existant, qui ne fait que le déploiement.
# Mise en place et secrets : docs/deploiement.md, « Déploiement automatique ».
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version déjà publiée à redéployer (vX.Y.Z)"
        required: true
        type: string

# Une release à la fois, jamais interrompue. Une seconde en attente remplace la précédente : le calcul
# depuis le dernier tag reprend alors tous les commits.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, life-tracker]
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Version suivante, tag et GitHub Release
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          tag="$(deploy/next-version.sh "$SHA" "$notes")"
          if [ -z "$tag" ]; then
            echo "Rien à publier : aucun changement des images."
            exit 0
          fi
          echo "Release $tag sur $SHA"
          cat "$notes"
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file "$notes"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  # Retour arrière ou redéploiement : la version doit exister, tag et GitHub Release.
  existing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, life-tracker]
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Version existante
        id: check
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag attendu : vX.Y.Z" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent
          gh release view "$TAG" --json tagName --jq .tagName
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  images:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: [self-hosted, life-tracker]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, web, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Nom de l'image en minuscules, comme ghcr.io l'exige
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${COMPONENT}" >> "$GITHUB_OUTPUT"
        env:
          COMPONENT: ${{ matrix.component }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Le NAS n'accepte de cette clé que `deploy vX.Y.Z <sha256 de compose.yaml>` (deploy/deploy.sh) ;
  # il ne reçoit aucun fichier. Un seul déploiement à la fois, jamais interrompu. Le checkout est celui
  # de la version déployée : l'empreinte de compose.yaml lui correspond.
  deploy:
    needs: [version, existing, images]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_run' && needs.images.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.existing.result == 'success'))
    runs-on: [self-hosted, life-tracker]
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || needs.existing.outputs.tag }}
          persist-credentials: false
      - name: Déploiement sur le NAS
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT }}
          TAG: ${{ needs.version.outputs.tag || needs.existing.outputs.tag }}
        run: |
          key="$RUNNER_TEMP/nas_key"
          known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          (umask 077 && printf '%s\n' "$NAS_SSH_KEY" >"$key")
          # Le runner est sur le NAS (réseau de l'hôte) : SSH par 127.0.0.1, sans Tailscale. Les clés
          # d'hôte de NAS_KNOWN_HOSTS restent la référence, réécrites pour cette adresse.
          printf '%s\n' "$NAS_KNOWN_HOSTS" | awk -v h="[127.0.0.1]:$NAS_SSH_PORT" 'NF { $1 = h; print }' >"$known"
          sha="$(sha256sum compose.yaml | cut -d' ' -f1)"
          echo "deploy $TAG $sha"
          ssh -i "$key" -p "$NAS_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$NAS_USER@127.0.0.1" "deploy $TAG $sha"
