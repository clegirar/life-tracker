# Tests de chaque PR et de chaque push sur main, en quatre jobs parallèles (plus le script de
# déploiement). Les images ne se construisent qu'à la release : .github/workflows/release.yml.
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      # Ce que change une PR de release, seule : version et CHANGELOG.
      - "version.txt"
      - ".release-please-manifest.json"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "version.txt"
      - ".release-please-manifest.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: db/test/run.sh

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, d'après backend/rust-toolchain.toml
        working-directory: backend
        run: rustup toolchain install
      # Seul ce job enregistre le cache : il compile tout ce que web et mcp recompilent (cargo build).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: backend
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      - name: Format et clippy
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - run: backend/test.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust, d'après backend/rust-toolchain.toml
        working-directory: backend
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: backend
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Chromium et ses bibliothèques système
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: web/test.sh

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Rust, d'après backend/rust-toolchain.toml
        working-directory: backend
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          shared-key: backend
          save-if: false
      - name: Dépendances du serveur MCP
        working-directory: mcp
        run: npm ci
      - run: mcp/test.sh

  deploy-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck est déjà sur l'image ubuntu-24.04.
      - run: deploy/test.sh
