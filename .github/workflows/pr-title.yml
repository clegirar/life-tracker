# Le titre de la PR devient le message du commit sur main (fusion en squash) : il suit Conventional
# Commits, `type(scope): description en français`, et pilote les versions de release-please.
name: Titre de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            chore
            ci
            build
          scopes: |
            backend
            web
            mcp
            db
            deploy
            ci
          requireScope: false
