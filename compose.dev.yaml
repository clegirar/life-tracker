# PostgreSQL de développement sur le Mac, avec ses propres données de test (jamais la production).
#   cp .env.example .env && docker compose -f compose.dev.yaml up -d
# Port 54329 pour ne pas gêner un Postgres local sur 5432.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TRACKER_OWNER_PASSWORD: ${TRACKER_OWNER_PASSWORD:?}
      TRACKER_APP_PASSWORD: ${TRACKER_APP_PASSWORD:?}
      TRACKER_ADMIN_PASSWORD: ${TRACKER_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql  # PostgreSQL 18 range ses données sous /var/lib/postgresql/18
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tracker"]
      interval: 5s
      retries: 10

volumes:
  db-data:
